# Project metadata, dependencies, and every linter/type-checker/test-runner
# config live here, in one file.
[project]
name = "craftainer-observability"
# Single source of the version. Stays 0.0.0 in git: release.yml's tag is the
# real version, stamped into the build at release time without a commit.
version = "0.0.0"
description = "Health checks, structured logging, OpenTelemetry, request IDs and profiling for FastAPI services"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1,<1",
]

# Every extra is optional: the core (health framework, request-ID middleware)
# needs FastAPI only. Each extra's modules import their library lazily or are
# only imported by the caller that opted in (see README.md).
[project.optional-dependencies]
# logs.py and otel.py (they also import sqlalchemy's AsyncEngine for typing).
otel = [
    "opentelemetry-sdk>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
    "opentelemetry-instrumentation-logging>=0.65b0,<1",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
]
# Upper bound: opentelemetry-instrumentation-sqlalchemy supports < 2.1 only.
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.54,<2.1"]
redis = ["redis>=8.1.0,<9"]
s3 = ["boto3>=1.43.98,<2"]
http = ["httpx>=0.28.1,<1"]
profiling = ["pyinstrument>=5.1.3,<6"]
analytics = ["httpx>=0.28.1,<1"]

[dependency-groups]
# Installed by a plain `uv sync` (uv's default group).
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-benchmark==5.3.0",
    "pytest-codspeed==5.0.3",
    "import-linter==2.15",
    "pip-audit==2.10.1",
    "boto3-stubs[s3]==1.43.98",
    # starlette.testclient (used by the tests) wants httpx2.
    "httpx2==2.13.0",
    # The unit tests exercise every extra.
    "craftainer-observability[otel,sqlalchemy,redis,s3,http,profiling,analytics]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/craftainer_observability"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Kept outside the bind-mounted /workspace: a cache dir inside the mount gets
# scanned file-by-file by host antivirus tools on Windows and is slow to write.
cache-dir = "/home/vscode/.cache/ruff"

[tool.ruff.lint]
# Curated strict set: correctness + style + security (S) + pylint (PL) +
# mandatory type annotations (ANN) + docstrings on public members (D1xx).
# COM812/ISC001 conflict with the ruff formatter (ruff's own recommendation).
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "N", "S", "A", "SIM", "RUF", "PL", "ANN",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["craftainer_observability"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; comparing to literal values is not a magic number.
"tests/**" = ["S101", "PLR2004"]

[tool.importlinter]
root_packages = ["craftainer_observability"]
# Needed so the forbidden contract below can name packages that are not part of this
# distribution (app, craftainer_crud).
include_external_packages = true

# health/ is a small one-directional stack: router sits above registry above
# base. A layer may import a layer listed after it, never one listed before it.
[[tool.importlinter.contracts]]
name = "health layers"
type = "layers"
containers = ["craftainer_observability.health"]
layers = ["router", "registry", "base"]

# This package is a dependency of apps and of craftainer-crud's consumers, never the
# other way round.
[[tool.importlinter.contracts]]
name = "observability never imports app or crud"
type = "forbidden"
source_modules = ["craftainer_observability"]
forbidden_modules = ["app", "craftainer_crud"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
warn_unreachable = true
cache_dir = "/home/vscode/.cache/mypy"

[tool.pytest.ini_options]
cache_dir = "/home/vscode/.cache/pytest"
# tests/bench is run explicitly: `uv run pytest tests/bench --no-cov`.
addopts = "--strict-markers --strict-config -ra --ignore=tests/bench --cov=craftainer_observability --cov-report=term-missing"
testpaths = ["tests/unit"]
# Lets an `async def test_...` run without a per-test @pytest.mark.asyncio marker.
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # starlette's testclient still references the anyio.abc.BlockingPortal alias
    # that anyio deprecated in favor of anyio.from_thread.BlockingPortal -- a
    # starlette bug, not ours to fix here.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]

[tool.coverage.run]
source = ["craftainer_observability"]
branch = true
relative_files = true
data_file = "/home/vscode/.cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 100
show_missing = true
